name: One-Click Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libpng-dev libjpeg-dev libfreetype6-dev libxft-dev libxcursor-dev git curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          # rely on runner-provided tools; install cmake if missing
          brew install cmake || true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' || true

      - name: Configure (light)
        run: |
          mkdir -p build
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=OFF -DKREPL_BUILD=OFF -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=OFF
          else
            cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=OFF -DKREPL_BUILD=OFF -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=OFF
          fi

      - name: Build targets
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build --config Release --target replfltk repl_demo -- /m || true
          else
            cmake --build build --target replfltk repl_demo -j || true
          fi

      - name: Collect deliverables (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          powershell -Command "Get-ChildItem -Path build -Recurse -Include *.exe,*.dll,*.dylib,*.so | ForEach-Object { Copy-Item $_.FullName -Destination 'dist' -Force }"
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../release-windows-${{ github.run_id }}.zip -Force"
          cd ..

      - name: Collect deliverables (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          find build -type f \( -name 'repl_demo' -o -name 'replfltk' -o -name 'skred_repl' \) -exec cp --parents {} dist/ \; || true
          tar -C dist -czf release-${{ matrix.os }}-${{ github.run_id }}.tar.gz . || true

      - name: Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -Command "if (Test-Path 'release-windows-${{ github.run_id }}.zip') { $h = Get-FileHash -Algorithm SHA256 'release-windows-${{ github.run_id }}.zip'; "$($h.Hash)  release-windows-${{ github.run_id }}.zip" | Out-File -FilePath release-windows-${{ github.run_id }}.zip.sha256 -Encoding ascii }"

      - name: Compute SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f release-${{ matrix.os }}-${{ github.run_id }}.tar.gz ]; then sha256sum release-${{ matrix.os }}-${{ github.run_id }}.tar.gz > release-${{ matrix.os }}-${{ github.run_id }}.tar.gz.sha256; fi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated one-click release: packaged binaries (light build, SKRED disabled)."

      - name: Upload release asset (Windows)
        if: runner.os == 'Windows' && always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-windows-${{ github.run_id }}.zip
          asset_name: release-windows-${{ github.run_id }}.zip
          asset_content_type: application/zip

      - name: Upload release asset (Windows SHA256)
        if: runner.os == 'Windows' && always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-windows-${{ github.run_id }}.zip.sha256
          asset_name: release-windows-${{ github.run_id }}.zip.sha256
          asset_content_type: text/plain

      - name: Upload release asset (Unix)
        if: runner.os != 'Windows' && always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-${{ matrix.os }}-${{ github.run_id }}.tar.gz
          asset_name: release-${{ matrix.os }}-${{ github.run_id }}.tar.gz
          asset_content_type: application/gzip

      - name: Upload release asset (Unix SHA256)
        if: runner.os != 'Windows' && always()
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: release-${{ matrix.os }}-${{ github.run_id }}.tar.gz.sha256
          asset_name: release-${{ matrix.os }}-${{ github.run_id }}.tar.gz.sha256
          asset_content_type: text/plain
