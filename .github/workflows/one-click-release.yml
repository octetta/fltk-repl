name: One-Click Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libpng-dev libjpeg-dev libfreetype6-dev libxft-dev libxcursor-dev git curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake || true

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' || true

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKRED_SHA256: ${{ secrets.SKRED_SHA256_${{ matrix.os == 'macos-latest' && 'MACOS' || matrix.os == 'windows-latest' && 'WINDOWS' || 'LINUX' }} }}
        run: |
          New-Item -ItemType Directory -Force -Path build > $null
          try {
            cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=ON -DKREPL_BUILD=ON -DKREPL_FETCH_KSYNTH=ON -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=OFF
          } catch {
            Write-Host "CMake configure failed (continuing): $_"
          }

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          SKRED_SHA256: ${{ secrets.SKRED_SHA256_${{ matrix.os == 'macos-latest' && 'MACOS' || matrix.os == 'windows-latest' && 'WINDOWS' || 'LINUX' }} }}
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=ON -DKREPL_BUILD=ON -DKREPL_FETCH_KSYNTH=ON -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=OFF

      - name: Build skrepl/krepl (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try {
            cmake --build build --config Release --target skred_repl krepl -- /m
          } catch {
            Write-Host "Build failed (continuing): $_"
          }

      - name: Build skrepl/krepl (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --target skred_repl krepl -j || true

      - name: Collect deliverables (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          # copy any .exe/.dll from build tree, including Release subfolders
          powershell -Command "Get-ChildItem -Path build -Recurse -File -Include *.exe,*.dll | ForEach-Object { Copy-Item $_.FullName -Destination 'dist' -Force }"
          cd dist
          powershell -Command "Compress-Archive -Path * -DestinationPath ../release-windows-${{ github.run_id }}.zip -Force"
          cd ..

      - name: Collect deliverables (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          # include macOS app bundle if present
          if [ -d "build/skrepl.app" ]; then
            cp -r build/skrepl.app dist/ || true
          fi
          # copy any likely binaries (krepl, skrepl, skred_repl) from build tree
          find build -type f \( -executable -and \( -name 'krepl' -o -name 'skrepl' -o -name 'skred_repl' \) \) -exec cp --parents {} dist/ \; || true
          # also look in Release subdirs and copy shared libs
          find build -type f \( -path '*/Release/*' -and \( -name 'krepl' -o -name 'skrepl' -o -name '*.so' -o -name '*.dylib' \) \) -exec cp --parents {} dist/ \; || true
          tar -C dist -czf release-${{ matrix.os }}-${{ github.run_id }}.tar.gz . || true

      - name: Compute SHA256 (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ -f release-${{ matrix.os }}-${{ github.run_id }}.tar.gz ]; then sha256sum release-${{ matrix.os }}-${{ github.run_id }}.tar.gz > release-${{ matrix.os }}-${{ github.run_id }}.tar.gz.sha256; fi

      - name: Compute SHA256 (Windows)
        if: runner.os == 'Windows'
        run: |
          powershell -Command "if (Test-Path 'release-windows-${{ github.run_id }}.zip') { $h = Get-FileHash -Algorithm SHA256 'release-windows-${{ github.run_id }}.zip'; "$($h.Hash)  release-windows-${{ github.run_id }}.zip" | Out-File -FilePath release-windows-${{ github.run_id }}.zip.sha256 -Encoding ascii }"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: |
            release-${{ matrix.os }}-${{ github.run_id }}.tar.gz
            release-${{ matrix.os }}-${{ github.run_id }}.tar.gz.sha256
            release-windows-${{ github.run_id }}.zip
            release-windows-${{ github.run_id }}.zip.sha256
          if-no-files-found: ignore

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts || true

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated one-click release: packaged skrepl/krepl binaries."

      - name: Upload release assets via curl
        run: |
          set -euo pipefail
          UPLOAD_URL="${{ steps.create_release.outputs.upload_url }}"
          echo "Upload URL: $UPLOAD_URL"
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            mime=$(file --mime-type -b "$f" || echo application/octet-stream)
            echo "Uploading $name ($mime)"
            curl -sS -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Content-Type: $mime" --data-binary @"$f" "$UPLOAD_URL?name=$name"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
