name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libpng-dev libjpeg-dev libfreetype6-dev libxft-dev libxcursor-dev git curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
        run: |
          brew update
          brew install pkg-config libpng jpeg freetype fontconfig

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y 7zip curl

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=OFF -DKREPL_FETCH_KSYNTH=OFF -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=ON

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSKRED_BUILD_REPL=OFF -DKREPL_FETCH_KSYNTH=OFF -DREPL_BUILD_DEMO=ON -DBUILD_TESTING=ON

      - name: Build targets (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target replfltk repl_demo -- /m

      - name: Build targets (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build --target replfltk repl_demo -j

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: ctest --test-dir build --output-on-failure

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os }}-${{ github.run_id }}
          path: build
